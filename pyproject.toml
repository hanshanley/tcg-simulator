[project]
name = "tcg-studio"
version = "0.1.0"
description = "A local-first CABT research studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "kaggle-environments==1.33.3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

# We load only the self-contained ctypes CABT wrapper, not the environment
# registry or any other game's heavyweight dependencies.
[[tool.uv.dependency-metadata]]
name = "kaggle-environments"
version = "1.33.3"
requires-dist = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
